<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F4C5C">
  <title>Dindo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Nunito:wght@600;700;800;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg">
  <link rel="apple-touch-icon" href="icon-192.png">
  <script>try { const q = new URLSearchParams(location.search); document.documentElement.dataset.theme = q.get("theme") || localStorage.getItem("dindo.theme") || "light";
    const th = document.documentElement.dataset.theme; if (q.has("pal")) localStorage.setItem("dindo.pal." + th, q.get("pal"));
    const v = localStorage.getItem("dindo.pal." + th); document.documentElement.dataset.pal = v === null ? (th === "dark" ? "corp" : "verde") : v; } catch (e) {}</script>
</head>
<body>
  <aside class="side" id="side"></aside>
  <header class="mtop" id="mtop"></header>
  <main class="main"><div id="view" class="view"></div></main>
  <nav class="mnav" id="mnav"></nav>
  <div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
  <div class="toast" id="toast" hidden></div>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
